principles:
  - title: Own the whole slice
    text: I take a feature from the first conversation to the deploy, and I stay with it until it works for the person using it.
  - title: Agree it before I build it
    text: Before engineering starts, every requirement is written down and the customer has said yes to it. Then what I build is what they actually need.
  - title: Ship small, ship often
    text: Small pull requests, tests at every level, and context left in files, so whoever picks it up next never starts cold.
