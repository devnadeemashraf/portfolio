principles:
  - title: Own the whole slice
    text: Requirements, schema, API, UI and deploy pipeline. I follow a feature until it works for the person using it.
  - title: Agree it before you build it
    text: I approve or reject every requirement in writing before engineering starts, so the build matches what the customer actually needs.
  - title: Ship small, ship often
    text: Small pull requests, tests at every level and context handed off in files, so the next person never starts cold.
